app = 'z-domicile-seo-agent'
primary_region = 'cdg'

[build]

# One-shot scheduled job: never restart on exit. The GH Actions cron is the
# only thing that should ever wake this machine. Without this, Fly retries the
# CMD up to 10× on failure — wasting Anthropic credits on every transient or
# billing error.
[[restart]]
  policy = "never"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'seo_data'
  destination = '/app/data'
  initial_size = '1gb'
