name: SEO Agent

on:
  schedule:
    # Every Monday at 08:00 UTC — triggers the Fly machine.
    - cron: "0 8 * * 1"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "context/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "fly.toml"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: "run"
        type: choice
        options:
          - run         # spawn a one-shot Fly machine (no rebuild)
          - deploy      # rebuild + push image to Fly registry
          - deploy-run  # rebuild then immediately run

concurrency:
  group: seo-agent
  cancel-in-progress: false

env:
  FLY_APP: z-domicile-seo-agent
  FLY_REGION: cdg
  FLY_VOLUME: seo_data
  FLY_IMAGE: registry.fly.io/z-domicile-seo-agent:latest

jobs:
  deploy:
    name: Build & push image to Fly
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy' || inputs.mode == 'deploy-run'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build & push image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --build-only --push --remote-only --app "$FLY_APP"

  run:
    name: Spawn one-shot Fly machine
    needs: [deploy]
    # `always()` lets this job run even when `deploy` is skipped (cron / mode=run).
    # We still want to bail if `deploy` actually failed.
    if: |
      always()
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'run' || inputs.mode == 'deploy-run')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run agent on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machine run "$FLY_IMAGE" \
            --app "$FLY_APP" \
            --region "$FLY_REGION" \
            --volume "${FLY_VOLUME}:/app/data" \
            --rm
